<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>X3000 Animatic Preview</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0d0f14;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Segoe UI', Arial, sans-serif;
    padding: 24px 12px;
  }
  .phone {
    position: relative;
    width: 380px;
    height: 676px;
    max-width: 92vw;
    max-height: 80vh;
    aspect-ratio: 9/16;
    border-radius: 28px;
    overflow: hidden;
    background: #000;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6), 0 0 0 6px #1a1d24;
  }
  .scene {
    position: absolute;
    inset: 0;
    opacity: 0;
    transition: opacity 0.5s ease;
  }
  .scene.active { opacity: 1; }
  .bg-blur {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
    filter: blur(22px) brightness(0.45) saturate(1.1);
    transform: scale(1.15);
  }
  .fg-wrap {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .fg-img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    position: relative;
    z-index: 2;
  }
  .scrim {
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom, rgba(0,0,0,0.05) 0%, rgba(0,0,0,0.0) 35%, rgba(0,0,0,0.8) 100%);
    z-index: 3;
    pointer-events: none;
  }
  .headline {
    position: absolute;
    left: 20px;
    right: 20px;
    bottom: 108px;
    color: #fff;
    font-size: 25px;
    font-weight: 800;
    line-height: 1.25;
    text-shadow: 0 2px 10px rgba(0,0,0,0.85);
    letter-spacing: 0.3px;
    z-index: 4;
  }
  .accent { color: #ffc531; }
  .caption-bar {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 14px 18px 20px;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(2px);
    z-index: 4;
  }
  .caption-text {
    color: #f2f2f2;
    font-size: 13.5px;
    font-style: italic;
    opacity: 0.92;
  }
  .brand-tag {
    position: absolute;
    top: 16px;
    left: 16px;
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(0,0,0,0.5);
    padding: 5px 10px;
    border-radius: 20px;
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.5px;
    z-index: 5;
  }
  .wide-tag {
    position: absolute;
    top: 16px;
    right: 16px;
    background: rgba(255,197,49,0.9);
    color: #1a1200;
    padding: 4px 9px;
    border-radius: 20px;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.5px;
    z-index: 5;
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  .wide-tag.show { opacity: 1; }
  .progress-wrap {
    position: absolute;
    top: 10px;
    left: 10px;
    right: 10px;
    display: flex;
    gap: 4px;
    z-index: 10;
  }
  .progress-seg {
    flex: 1;
    height: 3px;
    background: rgba(255,255,255,0.35);
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: #ffc531;
  }
  .progress-seg.done .progress-fill { width: 100%; }
  .controls { margin-top: 18px; display: flex; gap: 12px; }
  .btn {
    background: #1a1d24; color: #fff; border: 1px solid #333;
    padding: 9px 18px; border-radius: 20px; font-size: 13px;
    cursor: pointer; font-weight: 600;
  }
  .btn:hover { background: #262a33; }
  .label { color: #888; font-size: 12px; margin-top: 10px; text-align: center; max-width: 380px; }
</style>
</head>
<body>

<div class="phone" id="phone">
  <div class="progress-wrap" id="progressWrap"></div>
  <div class="brand-tag">🚛 SHACMAN X3000</div>
  <div id="sceneContainer"></div>
</div>

<div class="controls">
  <button class="btn" id="playBtn">⏸ Tạm dừng</button>
  <button class="btn" id="restartBtn">↻ Xem lại</button>
</div>
<div class="label">Mỗi cảnh: hiện toàn bộ xe trước → zoom dần vào chi tiết. Bản preview bố cục — không phải video xuất bản.</div>

const sceneContainer = document.getElementById('sceneContainer');
const progressWrap = document.getElementById('progressWrap');

SCENES.forEach((s, i) => {
  const div = document.createElement('div');
  div.className = 'scene';
  div.id = 'scene-' + i;
  const src = 'data:image/jpeg;base64,' + IMAGES[s.img];
  div.innerHTML = `
    <div class="bg-blur" style="background-image:url('${src}')"></div>
    <div class="fg-wrap">
      <img class="fg-img" id="fgimg-${i}" src="${src}" style="transform-origin:${s.origin};">
    </div>
    <div class="wide-tag" id="widetag-${i}">TOÀN CẢNH</div>
    <div class="scrim"></div>
    <div class="headline">${s.headline}</div>
    <div class="caption-bar"><div class="caption-text">${s.caption}</div></div>
  `;
  sceneContainer.appendChild(div);

  const seg = document.createElement('div');
  seg.className = 'progress-seg';
  seg.id = 'seg-' + i;
  seg.innerHTML = '<div class="progress-fill" id="fill-' + i + '"></div>';
  progressWrap.appendChild(seg);
});

let current = 0;
let playing = true;
let sceneTimer = null;

function animateZoom(idx) {
  const s = SCENES[idx];
  const img = document.getElementById('fgimg-' + idx);
  const wideTag = document.getElementById('widetag-' + idx);
  img.style.transition = 'none';
  img.style.transform = 'scale(1)';
  wideTag.classList.add('show');

  // hold wide shot for ~28% of duration, then zoom in for the rest
  const holdTime = Math.min(1200, s.dur * 0.28);
  requestAnimationFrame(() => {
    setTimeout(() => {
      wideTag.classList.remove('show');
      img.style.transition = `transform ${s.dur - holdTime}ms cubic-bezier(0.25,0.1,0.25,1)`;
      img.style.transform = `scale(${s.zoom})`;
    }, holdTime);
  });
}

function showScene(idx) {
  document.querySelectorAll('.scene').forEach(el => el.classList.remove('active'));
  document.getElementById('scene-' + idx).classList.add('active');

  document.querySelectorAll('.progress-seg').forEach((el, i) => {
    el.classList.toggle('done', i < idx);
    const fill = el.querySelector('.progress-fill');
    if (i < idx) fill.style.width = '100%';
    else if (i > idx) fill.style.width = '0%';
  });

  const fill = document.getElementById('fill-' + idx);
  fill.style.width = '0%';
  fill.style.transition = 'none';
  requestAnimationFrame(() => {
    fill.style.transition = `width ${SCENES[idx].dur}ms linear`;
    fill.style.width = '100%';
  });

  animateZoom(idx);
}

function nextScene() {
  showScene(current);
  clearTimeout(sceneTimer);
  sceneTimer = setTimeout(() => {
    current = (current + 1) % SCENES.length;
    nextScene();
  }, SCENES[current].dur);
}

nextScene();

document.getElementById('playBtn').addEventListener('click', function() {
  playing = !playing;
  if (!playing) {
    clearTimeout(sceneTimer);
    document.querySelectorAll('.progress-fill').forEach(f => {
      const cs = getComputedStyle(f);
      f.style.width = cs.width;
      f.style.transition = 'none';
    });
    document.querySelectorAll('.fg-img').forEach(im => {
      const cs = getComputedStyle(im);
      im.style.transform = cs.transform;
      im.style.transition = 'none';
    });
    this.textContent = '▶ Tiếp tục';
  } else {
    this.textContent = '⏸ Tạm dừng';
    nextScene();
  }
});

document.getElementById('restartBtn').addEventListener('click', () => {
  current = 0;
  playing = true;
  document.getElementById('playBtn').textContent = '⏸ Tạm dừng';
  nextScene();
});
</script>
